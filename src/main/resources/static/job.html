<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Job details | JobFinder</title>
<style>body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#182230}main{max-width:760px;margin:40px auto;padding:24px;background:white;border-radius:12px}a{color:#1d4ed8}</style></head>
<body><main><a href="/">← Back to jobs</a><div id="details"><p>Loading job details…</p></div></main>
<script>
const id=new URLSearchParams(location.search).get('id');
fetch('/api/jobs/'+encodeURIComponent(id||'')).then(async r=>{
 if(!r.ok) throw new Error('Job not found');
 return r.json();
}).then(j=>{
 document.querySelector('#details').innerHTML=`<h1 id="jobTitle">${j.title}</h1><p id="company">${j.company}</p><p>${j.location} · ${j.type}</p>`;
}).catch(()=>document.querySelector('#details').innerHTML='<h1>Job not found</h1><p>The requested job does not exist.</p>');
</script></body></html>
